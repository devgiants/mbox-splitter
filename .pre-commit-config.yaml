repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black .
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [ python ]

      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [ python ]
        args:
          [
            "-rn", # Only display messages
            "-sn", # Don't display the score
#            "--rcfile=pylintrc", # Link to your config file
#            "--load-plugins=pylint.extensions.docparams", # Load an extension
          ]
      - id: perflint
        name: perflint
        entry: poetry run perflint
        language: system
        types: [ python ]